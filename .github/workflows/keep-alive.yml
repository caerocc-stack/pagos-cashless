name: Keep alive (despierta Render)

# Pinguea la app cada 10 minutos para que Render free no la duerma.
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede atrasarlo unos minutos)
  workflow_dispatch:           # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://pagos-cashless.onrender.com/health)
          echo "HTTP $code"
          # 200 = despierta. Si estaba dormida, este ping la despierta igual.
          if [ "$code" != "200" ]; then echo "Aviso: respondio $code"; fi

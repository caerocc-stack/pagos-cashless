<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APAI Pay - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #15233b 0%, #1f3354 55%, #2b4368 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(61,127,196,0.25), transparent 70%);
            top: -200px; right: -150px;
        }
        body::after {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(160,30,34,0.18), transparent 70%);
            bottom: -180px; left: -120px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            width: 390px;
            box-shadow: 0 24px 70px rgba(0,0,0,0.45);
            position: relative;
            z-index: 1;
            border-top: 4px solid #a01e22;
        }
        .login-logo {
            display: block;
            width: 92px; height: 92px;
            object-fit: contain;
            margin: 0 auto 1rem;
        }
        .login-card h1 {
            text-align: center;
            color: #15233b;
            font-size: 1.45rem;
            margin-bottom: 0.2rem;
        }
        .login-card .sub {
            text-align: center;
            color: #5b6b80;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1.8rem;
        }
        label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
            color: #5b6b80;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { outline: none; border-color: #3d7fc4; box-shadow: 0 0 0 3px rgba(61,127,196,0.15); }
        button {
            width: 100%;
            padding: 0.85rem;
            background: #a01e22;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #7d1619; }
        .error {
            background: #fef2f2;
            color: #a01e22;
            padding: 0.7rem;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
        .pie {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.72rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/static/logo.png" alt="APAI" class="login-logo">
        <h1>APAI Pay</h1>
        <p class="sub">Asociación de Padres y Alumnos del I.N.A.C</p>
        <div class="error" id="error"></div>
        <form onsubmit="login(event)">
            <label>Usuario</label>
            <input type="text" id="username" required autofocus autocomplete="username">
            <label>Contraseña</label>
            <input type="password" id="password" required autocomplete="current-password">
            <button type="submit">Ingresar</button>
        </form>
        <div class="pie">Sistema interno · Acceso restringido</div>
    </div>
    <script>
        async function login(e) {
            e.preventDefault();
            const errEl = document.getElementById('error');
            errEl.style.display = 'none';
            try {
                const body = JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                });
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: body,
                    credentials: 'same-origin',
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error al iniciar sesión');
                window.location.href = '/';
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
